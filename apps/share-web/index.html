<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PaceLab · ผลการวิ่ง</title><style>body{margin:0;background:#f1f4f8;color:#182232;font:16px system-ui,sans-serif}.card{max-width:640px;margin:40px auto;padding:28px;background:#fff;border-left:5px solid #43c7b5;box-shadow:0 8px 24px #18223218}.eyebrow{color:#159e9a;font-weight:900;letter-spacing:2px}.stats{display:flex;gap:12px;margin-top:24px}.stat{flex:1;background:#e5f5f1;padding:16px}.label{font-size:12px;color:#607184;font-weight:800}.value{font-size:28px;font-weight:900;margin-top:8px}@media(max-width:600px){.card{margin:16px}.stats{flex-direction:column}}</style></head><body><main class="card"><div class="eyebrow">PACELAB · SHARED RUN</div><h1 id="title">กำลังโหลดผลการวิ่ง…</h1><div id="content"></div></main><script>const p=new URLSearchParams(location.search),t=p.get('token'),c=document.getElementById('content');if(!t){document.getElementById('title').textContent='ไม่พบลิงก์แชร์';}else{fetch(`https://mfhckcklhsgbcdehmqvq.supabase.co/functions/v1/share-activity?token=${encodeURIComponent(t)}`).then(r=>r.ok?r.json():Promise.reject()).then(d=>{const a=d.activity;document.getElementById('title').textContent=a.mode==='free_run'?'Free Run':'Interval';c.innerHTML=`<div class="stats"><div class="stat"><div class="label">DISTANCE</div><div class="value">${(a.distanceM/1000).toFixed(2)} km</div></div><div class="stat"><div class="label">TIME</div><div class="value">${Math.floor(a.elapsedMs/60000)}:${String(Math.floor(a.elapsedMs/1000)%60).padStart(2,'0')}</div></div></div>`}).catch(()=>{document.getElementById('title').textContent='ลิงก์นี้หมดอายุหรือถูกยกเลิก';});}</script></body></html>
